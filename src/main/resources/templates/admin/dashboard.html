<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>Admin dashboard</h1>
  <div th:replace="~{fragments/layout :: adminnav('dash')}"></div>
  <div class="stats">
    <div class="stat"><b th:text="${todayOrders}">0</b><span>Orders today</span></div>
    <div class="stat"><b th:text="'₹' + ${#numbers.formatDecimal(todayRevenue,1,2)}">₹0</b><span>Revenue today</span></div>
    <div class="stat"><b th:text="${queueSize}">0</b><span>In kitchen queue</span></div>
    <div class="stat"><b th:text="${readyCount}">0</b><span>Ready at counter</span></div>
    <div class="stat"><b th:text="${userCount}">0</b><span>Registered users</span></div>
    <div class="stat"><b th:text="${foodCount}">0</b><span>Menu items</span></div>
  </div>
  <div class="split">
    <div class="card">
      <h2>Best sellers</h2>
      <p class="muted" th:if="${#lists.isEmpty(topSelling)}">No sales yet.</p>
      <table th:unless="${#lists.isEmpty(topSelling)}">
        <tr th:each="row : ${topSelling}"><td th:text="${row[0]}">Item</td><td class="right"><b th:text="${row[1]}">0</b> sold</td></tr>
      </table>
    </div>
    <div class="card">
      <h2>Low stock</h2>
      <p class="muted" th:if="${#lists.isEmpty(lowStock)}">Everything is well stocked.</p>
      <table th:unless="${#lists.isEmpty(lowStock)}">
        <tr th:each="f : ${lowStock}">
          <td th:text="${f.name}">Item</td>
          <td><span class="tag low" th:text="${f.stock} + ' left'">0</span></td>
          <td class="right"><a class="btn small ghost" th:href="@{/admin/foods}">Restock</a></td>
        </tr>
      </table>
    </div>
  </div>
  <h2 style="margin-top:26px">Recent orders</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Token</th><th>Customer</th><th>Time</th><th>Total</th><th>Status</th></tr></thead>
      <tbody>
        <tr th:each="o : ${recent}">
          <td class="price" th:text="${o.token.code}">T-001</td>
          <td th:text="${o.user.name}">Name</td>
          <td th:text="${#temporals.format(o.createdAt,'dd MMM, HH:mm')}">time</td>
          <td th:text="'₹' + ${#numbers.formatDecimal(o.total,1,2)}">₹0</td>
          <td><span th:class="'badge ' + ${#strings.toLowerCase(o.status.name())}" th:text="${o.status.label}">Placed</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
