<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1>My orders</h1>
  <div class="empty" th:if="${#lists.isEmpty(orders)}"><p>You haven’t ordered yet.</p><a class="btn" th:href="@{/menu}">Order your first meal</a></div>
  <div class="table-wrap" th:unless="${#lists.isEmpty(orders)}">
    <table>
      <thead><tr><th>Token</th><th>Placed</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td class="price" th:text="${o.token.code}">T-001</td>
          <td th:text="${#temporals.format(o.createdAt,'dd MMM, HH:mm')}">date</td>
          <td th:text="${o.itemCount} + ' item(s)'">1</td>
          <td th:text="'₹' + ${#numbers.formatDecimal(o.total,1,2)}">₹0</td>
          <td><span th:class="'badge ' + ${#strings.toLowerCase(o.status.name())}" th:text="${o.status.label}">Placed</span></td>
          <td><a class="btn small ghost" th:href="@{/orders/{id}(id=${o.id})}">View token</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
