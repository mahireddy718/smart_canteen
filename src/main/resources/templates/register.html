<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body class="auth-page">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="auth-shell">
  <div class="auth-art">
    <p class="eyebrow">A BETTER BREAK STARTS HERE</p>
    <h1>Eat well.<br><em>Skip the line.</em></h1>
    <p>Create your account and keep your token, orders and favourite meals in one place.</p>
    <span class="auth-art-food">🥞</span>
  </div>
  <div class="form-card auth-card">
    <span class="auth-kicker">JOIN THE TABLE</span>
    <h1>Create account</h1>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
      <label for="name">Full name</label>
      <input id="name" name="name" th:value="${name}" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" th:value="${email}" required>
      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" th:value="${phone}">
      <label for="password">Password (6+ characters)</label>
      <input id="password" name="password" type="password" minlength="6" required>
      <p><button class="btn big" type="submit" style="width:100%">Create account</button></p>
    </form>
    <p class="muted">Already registered? <a th:href="@{/login}">Log in</a>.</p>
  </div>
</main>
</body>
</html>
