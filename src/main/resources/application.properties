spring.application.name=smart-canteen
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m
server.error.include-message=never

# Local default: in-memory H2 (no setup needed). Render uses the "prod" profile (PostgreSQL).
spring.datasource.url=jdbc:h2:mem:canteen;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# Kitchen settings
canteen.kitchen-capacity=2
