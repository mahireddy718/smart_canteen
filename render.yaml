databases:
  - name: canteen-db
    plan: free
    databaseName: canteen
    user: canteen

services:
  - type: web
    name: smart-canteen
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: canteen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: canteen-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: canteen-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: canteen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: canteen-db
          property: password
